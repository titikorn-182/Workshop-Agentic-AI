<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — AI Desk</title><link rel="stylesheet" href="./style.css"></head><body><div class="ambient"></div><main class="app"><header class="topbar"><a class="brand" href="/"><span class="mark">✦</span><span>AI Desk</span></a><div class="status"><i></i> Online</div></header><section class="chat-card"><div class="heading"><div><div class="eyebrow">AI WORKSPACE</div><h1>คุยกับ AI</h1><p>ถามได้ทุกเรื่อง ให้ไอเดียของคุณไปได้ไกลกว่าเดิม</p></div><div class="spark lion-mini">🦁</div></div><section class="settings"><label><span>PROVIDER</span><select id="provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label><span>MODEL</span><input id="model" placeholder="ใช้ค่า default จากระบบ"></label></section><section id="messages" class="messages"><div class="empty"><div class="empty-icon">✦</div><strong>พร้อมช่วยเหลือคุณแล้ว</strong><p>พิมพ์ข้อความด้านล่างเพื่อเริ่มการสนทนา</p></div></section><form id="chat-form"><input id="message" autocomplete="off" placeholder="ถามอะไรก็ได้..." required><button aria-label="ส่งข้อความ">↑</button></form><div class="hint">กดปุ่มลูกศรเพื่อส่งข้อความ</div></section></main><script src="./app.js"></script></body></html>
